<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Pyramid – Math Practice | Kubi Kids School</title>
<meta name="description" content="Math practice with number pyramids for kids. Fun addition and multiplication practice.">

<link rel="stylesheet" href="../css/theme.css">
<script src="../css/theme.js"></script>

<style>
  :root {
    --accent:   #f59e0b;
    --accent2:  #ef4444;
    --green:    #22c55e;
    --purple:   #8b5cf6;
    --blue:     #3b82f6;
    --radius:   18px;
    --cell:     clamp(52px, 12vw, 82px);
  }

  /* Dark mode specific pyramid colors */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --cell-given-bg: rgba(139, 92, 246, 0.2);
      --cell-given-border: rgba(139, 92, 246, 0.5);
      --cell-given-text: #ddd6fe;
      --cell-input-bg: var(--surface);
      --cell-input-border: var(--border-strong);
      --cell-input-text: #ffffff;
    }
  }

  [data-theme="dark"] {
    --cell-given-bg: rgba(139, 92, 246, 0.2);
    --cell-given-border: rgba(139, 92, 246, 0.5);
    --cell-given-text: #ddd6fe;
    --cell-input-bg: var(--surface);
    --cell-input-border: var(--border-strong);
    --cell-input-text: #ffffff;
  }

  /* Light mode specific pyramid colors */
  :root, [data-theme="light"] {
    --cell-given-bg: #ede9fe;
    --cell-given-border: #a78bfa;
    --cell-given-text: #5b21b6;
    --cell-input-bg: #ffffff;
    --cell-input-border: #cbd5e1;
    --cell-input-text: #0f172a;
  }

  .pyramid-page-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    padding: 16px 8px 40px;
  }

  /* ── HEADER ── */
  .pyramid-header {
    text-align: center;
    margin-bottom: 24px;
  }

  .pyramid-header h1 {
    font-size: clamp(1.8rem, 6vw, 2.6rem);
    font-weight: 800;
    color: var(--text);
    letter-spacing: -0.5px;
    margin-bottom: 4px;
  }

  .pyramid-header p {
    color: var(--text-secondary);
    font-size: clamp(0.9rem, 2.5vw, 1.05rem);
  }

  /* ── SETTINGS CARD ── */
  .settings-card {
    background: var(--surface);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    border-radius: var(--radius);
    padding: 18px 22px;
    display: flex;
    flex-wrap: wrap;
    gap: 14px 20px;
    align-items: center;
    justify-content: center;
    margin-bottom: 24px;
    width: 100%;
    max-width: 720px;
  }

  .setting-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .setting-group label {
    font-size: 0.78rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--primary);
  }

  .setting-group select,
  .setting-group input[type="number"] {
    background: var(--bg-subtle);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    padding: 6px 12px;
    cursor: pointer;
    outline: none;
    transition: border-color 0.2s;
  }

  .setting-group select:focus,
  .setting-group input[type="number"]:focus {
    border-color: var(--primary);
  }

  .setting-group select option {
    background: var(--surface);
    color: var(--text);
  }

  /* ── BUTTONS ── */
  .btn-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 28px;
  }

  /* ── SCORE BAR ── */
  .score-bar {
    display: flex;
    gap: 16px;
    margin-bottom: 22px;
    font-size: clamp(0.9rem, 2.5vw, 1.05rem);
  }

  .score-pill {
    background: var(--surface);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    border-radius: 50px;
    padding: 8px 20px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    color: var(--text);
  }

  .score-pill .count { font-size: 1.25em; }
  .score-pill.correct .count { color: var(--success); }
  .score-pill.wrong .count { color: var(--danger); }

  /* ── PYRAMID AREA ── */
  #pyramid-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    margin-bottom: 30px;
    width: 100%;
  }

  .pyramid-row {
    display: flex;
    gap: 8px;
    align-items: center;
    justify-content: center;
  }

  /* ── CELL ── */
  .cell {
    width: var(--cell);
    height: var(--cell);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: clamp(1rem, 4vw, 1.5rem);
    position: relative;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  /* given (fixed) cell */
  .cell-given {
    background: var(--cell-given-bg);
    border: 2px solid var(--cell-given-border);
    color: var(--cell-given-text);
    cursor: default;
    box-shadow: var(--shadow-sm);
  }

  /* input cell */
  .cell-input {
    background: var(--cell-input-bg);
    border: 2px dashed var(--cell-input-border);
    box-shadow: var(--shadow-sm);
  }

  .cell-input input {
    width: 100%;
    height: 100%;
    background: transparent;
    border: none;
    outline: none;
    text-align: center;
    font-family: inherit;
    font-size: clamp(1.1rem, 4vw, 1.6rem);
    font-weight: 800;
    color: var(--cell-input-text);
    caret-color: var(--primary);
    -webkit-text-fill-color: var(--cell-input-text);
  }

  /* Remove number spinners */
  .cell-input input::-webkit-outer-spin-button,
  .cell-input input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .cell-input input[type=number] { -moz-appearance: textfield; }

  /* states */
  .cell-correct {
    background: var(--success-subtle) !important;
    border: 2px solid var(--success) !important;
    animation: popIn 0.3s ease;
  }

  .cell-correct input {
    -webkit-text-fill-color: var(--success) !important;
    color: var(--success) !important;
  }

  .cell-wrong {
    background: var(--danger-subtle) !important;
    border: 2px solid var(--danger) !important;
    animation: shake 0.4s ease;
  }

  .cell-wrong input {
    -webkit-text-fill-color: var(--danger) !important;
    color: var(--danger) !important;
  }

  .cell-revealed {
    background: var(--warning-subtle) !important;
    border: 2px solid var(--warning) !important;
  }

  .cell-revealed input {
    -webkit-text-fill-color: var(--warning-text) !important;
    color: var(--warning-text) !important;
  }

  @keyframes popIn {
    0%   { transform: scale(0.85); }
    60%  { transform: scale(1.1); }
    100% { transform: scale(1); }
  }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25%      { transform: translateX(-5px); }
    75%      { transform: translateX(5px); }
  }

  /* ── OPERATOR CONNECTOR ── */
  .connector {
    color: var(--text-muted);
    font-size: clamp(0.75rem, 2vw, 0.95rem);
    font-weight: 700;
    width: 18px;
    text-align: center;
    user-select: none;
  }

  /* ── FEEDBACK ── */
  #feedback {
    min-height: 36px;
    font-size: clamp(1rem, 3vw, 1.25rem);
    font-weight: 800;
    margin-bottom: 20px;
    text-align: center;
    transition: opacity 0.3s;
  }

  #feedback.ok  { color: var(--success); }
  #feedback.bad { color: var(--danger); }
  #feedback.hint { color: var(--warning-text); }

  /* ── RULE HINT ── */
  .rule-hint {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 20px;
    max-width: 520px;
    width: 100%;
    text-align: center;
    font-size: clamp(0.85rem, 2.5vw, 0.98rem);
    color: var(--text-secondary);
    line-height: 1.55;
    margin-bottom: 22px;
  }

  .rule-hint strong { color: var(--primary); }

  /* ── STARS ── */
  #stars {
    font-size: 2rem;
    margin-bottom: 10px;
    min-height: 2.5rem;
    text-align: center;
    letter-spacing: 4px;
  }

  /* ── PROGRESS BAR ── */
  .progress-wrap {
    width: 100%;
    max-width: 400px;
    background: var(--border);
    border-radius: 50px;
    height: 8px;
    margin-bottom: 26px;
    overflow: hidden;
  }

  #progress-bar {
    height: 100%;
    background: var(--primary);
    border-radius: 50px;
    width: 0%;
    transition: width 0.5s ease;
  }
</style>
</head>

  <!-- Top Navigation -->
  <header class="kubi-top-bar">
    <div class="kubi-nav-left">
      <a href="../index.html" class="kubi-back-link" id="pyramidBackLink">
        ← All Activities
      </a>
      <span class="kubi-page-title" id="pyramidPageTitle">Number Pyramid 🔺</span>
    </div>
    <div class="kubi-nav-right" style="display:flex; align-items:center; gap:10px;">
      <div class="lang-selector">
        <button type="button" class="lang-btn" data-lang="sk" onclick="setPyramidLanguage('sk')">SK</button>
        <button type="button" class="lang-btn active" data-lang="en" onclick="setPyramidLanguage('en')">EN</button>
        <button type="button" class="lang-btn" data-lang="de" onclick="setPyramidLanguage('de')">DE</button>
      </div>
      <button class="theme-toggle-btn" aria-label="Toggle theme"></button>
    </div>
  </header>

  <div class="pyramid-page-wrapper">
    <div class="pyramid-header">
      <h1 id="pyramidMainTitle">🔺 Number Pyramid</h1>
      <p id="header-sub">Fill in the pyramid!</p>
    </div>

<!-- SETTINGS -->
<div class="settings-card">
  <div class="setting-group">
    <label id="lblOperation">Operation</label>
    <select id="operation">
      <option value="mul" id="optMul" selected>✖ Multiplication</option>
      <option value="add" id="optAdd">➕ Addition</option>
    </select>
  </div>

  <div class="setting-group">
    <label id="lblLevel">Number of rows</label>
    <input type="number" id="level" value="3" min="2" max="7" style="width:70px">
  </div>

  <div class="setting-group">
    <label id="lblRange">Max base number</label>
    <input type="number" id="range" value="9" min="1" max="1000" style="width:70px">
  </div>

  <div class="setting-group">
    <label id="lblMaxResult">Max apex value</label>
    <input type="number" id="maxResult" value="100" min="10" max="100000" style="width:80px">
  </div>

  <div class="setting-group">
    <label id="lblHints">Hints</label>
    <select id="hints">
      <option value="full" id="optHintsFull">Many clues</option>
      <option value="some" id="optHintsSome" selected>Some clues</option>
      <option value="min" id="optHintsMin">Minimal clues</option>
    </select>
  </div>
</div>

<!-- SCORE -->
<div class="score-bar">
  <div class="score-pill correct">✅ <span class="count" id="correct-count">0</span></div>
  <div class="score-pill wrong">❌ <span class="count" id="wrong-count">0</span></div>
</div>

<!-- PROGRESS -->
<div class="progress-wrap"><div id="progress-bar"></div></div>

<!-- STARS -->
<div id="stars"></div>

<!-- FEEDBACK -->
<div id="feedback"></div>

<!-- PYRAMID -->
<div id="pyramid-container"></div>

<!-- BUTTONS -->
<div class="btn-row">
  <button class="btn btn-primary" id="btn-new" onclick="newPyramid()">🔀 New Pyramid</button>
  <button class="btn btn-success" id="btn-check" onclick="checkAll()">✔ Check</button>
  <button class="btn btn-secondary" id="btn-reveal" onclick="reveal()">💡 Solution</button>
</div>

<!-- RULE HINT -->
<div class="rule-hint" id="rule-hint">
  Enter the missing numbers into the empty cells and click <strong>✔ Check</strong>.
</div>

</div><!-- /.pyramid-page-wrapper -->

<script>
  // ── STATE ──
  let correctTotal = 0;
  let wrongTotal   = 0;
  let solved       = 0;
  let totalCells   = 0;
  let pyramidData  = []; // rows of numbers (complete solution)
  let cellEls      = []; // parallel structure to pyramidData
  let isGiven      = []; // which cells are pre-filled

  const feedbackEl = document.getElementById('feedback');
  const starsEl    = document.getElementById('stars');
  const progressEl = document.getElementById('progress-bar');

  // ── SETTINGS HELPERS ──
  function getRows() {
    const v = parseInt(document.getElementById('level').value, 10);
    return Math.max(2, Math.min(7, isNaN(v) ? 3 : v));
  }

  function getOperation() {
    return document.getElementById('operation').value; // 'add' | 'mul'
  }

  function getMax() {
    return parseInt(document.getElementById('range').value, 10);
  }

  function getHintRatio() {
    const h = document.getElementById('hints').value;
    if (h === 'full') return 0.65;
    if (h === 'min')  return 0.25;
    return 0.45;
  }

  function rand(a, b) {
    return Math.floor(Math.random() * (b - a + 1)) + a;
  }

  // Returns a base number biased away from 1 (1 appears ~10% of the time).
  // (Replaced by per-puzzle logic in buildPyramid — kept as no-op)

  function combine(a, b) {
    return getOperation() === 'mul' ? a * b : a + b;
  }

  function getMaxResult() {
    const v = parseInt(document.getElementById('maxResult').value, 10);
    return isNaN(v) ? 100 : Math.max(10, v);
  }

  // ── BUILD SOLUTION ──
  // Constraint-aware algorithm — NO brute-force retry for intermediate rows.
  //
  // For MULTIPLICATION, values compound exponentially (Pascal's triangle exponents):
  //   Highest non-apex row (row rows-2) worst-case = effMax ^ (2^(rows-2))
  //   → effMax = floor(maxVal ^ (1 / 2^(rows-2)))
  //
  // For ADDITION, values grow linearly:
  //   Highest non-apex row worst-case = effMax × 2^(rows-2)
  //   → effMax = floor(maxVal / 2^(rows-2))
  //
  // Generating from 2..effMax guarantees ALL non-apex constraints with 100% certainty.
  // Only the apex (top cell) is checked against maxResult (at most 100 retries).
  function buildPyramid(rows, maxVal) {
    const maxResult = getMaxResult();
    const isMul = getOperation() === 'mul';

    // Pre-compute guaranteed-safe base range
    let effMax;
    if (rows <= 2) {
      effMax = maxVal;
    } else if (isMul) {
      const exp = Math.pow(2, rows - 2);
      effMax = Math.floor(Math.pow(maxVal, 1 / exp));
    } else {
      const div = Math.pow(2, rows - 2);
      effMax = Math.floor(maxVal / div);
    }
    effMax = Math.max(1, effMax);
    const minBase = effMax >= 2 ? 2 : 1;

    // Build a complete pyramid from a given bottom row
    function buildFrom(bottom) {
      const pData = [bottom.slice()];
      for (let r = 1; r < rows; r++) {
        const prev = pData[r - 1];
        const row  = [];
        for (let c = 0; c < prev.length - 1; c++) row.push(combine(prev[c], prev[c + 1]));
        pData.push(row);
      }
      return pData.reverse();
    }

    // Generate; intermediate rows always pass — only check apex vs maxResult
    for (let attempt = 0; attempt < 100; attempt++) {
      const bottom = Array.from({length: rows}, () => rand(minBase, effMax));
      // 5% chance per puzzle of exactly one 1 at a random position
      if (effMax >= 2 && Math.random() < 0.05) {
        bottom[rand(0, rows - 1)] = 1;
      }
      const pyramid = buildFrom(bottom);
      if (pyramid[0][0] <= maxResult) return pyramid;
    }

    // Ultimate fallback: minimum valid values, no 1s if possible
    return buildFrom(Array.from({length: rows}, () => minBase));
  }


  // ── CHOOSE GIVENS ──
  // We always give bottom row or enough cells so puzzle is uniquely solvable
  function chooseGivens(data, ratio) {
    const rows = data.length;
    const given = data.map(row => row.map(() => false));

    // Always reveal the full bottom row (it anchors the puzzle)
    data[rows - 1].forEach((_, c) => { given[rows - 1][c] = true; });

    // Optionally un-reveal some bottom cells for harder mode
    const hintH = document.getElementById('hints').value;
    if (hintH === 'min') {
      // hide ~half of bottom row (must keep enough to solve)
      for (let c = 0; c < data[rows-1].length; c++) {
        if (Math.random() < 0.4) given[rows-1][c] = false;
      }
    }

    // Randomly reveal some interior cells based on ratio
    for (let r = 0; r < rows - 1; r++) {
      for (let c = 0; c < data[r].length; c++) {
        if (Math.random() < ratio) given[r][c] = true;
      }
    }

    // Always reveal top (makes it more satisfying)
    given[0][0] = true;

    return given;
  }

  // ── RENDER ──
  function renderPyramid() {
    const container = document.getElementById('pyramid-container');
    container.innerHTML = '';
    cellEls = pyramidData.map(r => r.map(() => null));

    const rows = pyramidData.length;
    const maxCols = pyramidData[rows - 1].length;

    pyramidData.forEach((row, r) => {
      const rowEl = document.createElement('div');
      rowEl.className = 'pyramid-row';

      row.forEach((val, c) => {
        const cell = document.createElement('div');
        cell.className = 'cell';

        if (isGiven[r][c]) {
          cell.classList.add('cell-given');
          cell.textContent = val;
        } else {
          cell.classList.add('cell-input');
          const inp = document.createElement('input');
          inp.type = 'number';
          inp.inputMode = 'numeric';
          inp.autocomplete = 'off';
          inp.id = `cell-${r}-${c}`;
          inp.setAttribute('aria-label', `Reihe ${r+1} Feld ${c+1}`);
          inp.addEventListener('keydown', e => {
            if (e.key === 'Enter') { e.preventDefault(); checkAll(); }
          });
          inp.addEventListener('input', () => {
            cell.classList.remove('cell-correct', 'cell-wrong', 'cell-revealed');
          });
          cell.appendChild(inp);
        }

        cellEls[r][c] = cell;
        rowEl.appendChild(cell);
      });

      container.appendChild(rowEl);
    });

    updateProgress();
  }

  // ── NEW PUZZLE ──
  function newPyramid() {
    const rows = getRows();
    const max  = getMax();
    const op   = getOperation();
    pyramidData = buildPyramid(rows, max);
    isGiven     = chooseGivens(pyramidData, getHintRatio());
    solved      = 0;

    // Count empty cells
    totalCells = 0;
    pyramidData.forEach((row, r) => row.forEach((_, c) => {
      if (!isGiven[r][c]) totalCells++;
    }));

    setFeedback('', '');
    starsEl.textContent = '';

    // Update dynamic UI text
    const opLabel = op === 'mul' ? 'Produkt' : 'Summe';
    const opSymbol = op === 'mul' ? '✖' : '➕';
    document.getElementById('header-sub').innerHTML =
      `Fülle die Pyramide aus – jede Zahl ist das <strong>${opLabel}</strong> der beiden darunter!`;
    document.getElementById('rule-hint').innerHTML =
      `<strong>📐 Regel ${opSymbol}:</strong> Jede Zahl = <strong>${opLabel}</strong> der zwei Zahlen direkt darunter.<br>
      Tippe die fehlenden Zahlen in die leeren Felder und drücke <strong>✔ Prüfen</strong>.`;

    renderPyramid();

    // Focus first input
    const first = document.querySelector('.cell-input input');
    if (first) first.focus();
  }

  // ── CHECK ALL ──
  function checkAll() {
    let allCorrect = true;
    let anyInput   = false;
    let newCorrect = 0;
    let newWrong   = 0;

    pyramidData.forEach((row, r) => {
      row.forEach((val, c) => {
        if (isGiven[r][c]) return;
        const inp  = cellEls[r][c].querySelector('input');
        const cell = cellEls[r][c];
        if (!inp) return;

        const userVal = inp.value.trim();
        if (userVal === '') { allCorrect = false; return; }

        anyInput = true;
        const userNum = parseInt(userVal, 10);

        if (userNum === val) {
          if (!cell.classList.contains('cell-correct') && !cell.classList.contains('cell-revealed')) {
            newCorrect++;
          }
          cell.classList.remove('cell-wrong', 'cell-revealed');
          cell.classList.add('cell-correct');
          inp.disabled = true;
        } else {
          allCorrect = false;
          newWrong++;
          cell.classList.remove('cell-correct', 'cell-revealed');
          cell.classList.add('cell-wrong');
          setTimeout(() => {
            cell.classList.remove('cell-wrong');
            inp.value = '';
          }, 600);
        }
      });
    });

    correctTotal += newCorrect;
    wrongTotal   += newWrong;
    document.getElementById('correct-count').textContent = correctTotal;
    document.getElementById('wrong-count').textContent   = wrongTotal;

    updateProgress();

    const t = PYRAMID_I18N[currentPyramidLang] || PYRAMID_I18N.en;

    if (!anyInput) {
      setFeedback(t.fbEmpty, 'hint');
      return;
    }

    if (allCorrect) {
      setFeedback(t.fbSolved, 'ok');
      showStars(3);
      confettiBurst();
      setTimeout(newPyramid, 2800);
    } else if (newCorrect > 0) {
      setFeedback(t.fbPartial(newCorrect), 'ok');
    } else {
      setFeedback(t.fbWrong, 'bad');
    }
  }

  // ── REVEAL ──
  function reveal() {
    pyramidData.forEach((row, r) => {
      row.forEach((val, c) => {
        if (isGiven[r][c]) return;
        const cell = cellEls[r][c];
        const inp  = cell.querySelector('input');
        if (!inp) return;
        cell.classList.remove('cell-correct', 'cell-wrong');
        cell.classList.add('cell-revealed');
        inp.value    = val;
        inp.disabled = true;
      });
    });
    const t = PYRAMID_I18N[currentPyramidLang] || PYRAMID_I18N.en;
    setFeedback(t.fbReveal, 'hint');
    starsEl.textContent = '';
    updateProgress();
  }

  // ── PROGRESS ──
  function updateProgress() {
    let filled = 0;
    pyramidData.forEach((row, r) => {
      row.forEach((val, c) => {
        if (isGiven[r][c]) return;
        const inp = cellEls[r][c]?.querySelector('input');
        if (inp && inp.value !== '' || cellEls[r][c]?.classList.contains('cell-correct') || cellEls[r][c]?.classList.contains('cell-revealed')) {
          filled++;
        }
      });
    });
    const pct = totalCells > 0 ? Math.round((filled / totalCells) * 100) : 0;
    progressEl.style.width = pct + '%';
  }

  // ── FEEDBACK ──
  function setFeedback(msg, cls) {
    feedbackEl.textContent = msg;
    feedbackEl.className   = cls;
  }

  // ── STARS ──
  function showStars(n) {
    starsEl.textContent = '⭐'.repeat(n);
    starsEl.style.animation = 'none';
    starsEl.offsetHeight; // reflow
    starsEl.style.animation = '';
  }

  // ── CONFETTI BURST (lightweight CSS) ──
  function confettiBurst() {
    const colors = ['#f7c948','#ff6b6b','#4ade80','#60a5fa','#a78bfa','#ff9f43'];
    for (let i = 0; i < 28; i++) {
      const dot = document.createElement('div');
      const size = rand(6, 12);
      dot.style.cssText = `
        position: fixed;
        left: ${rand(20,80)}vw;
        top: ${rand(10,40)}vh;
        width: ${size}px;
        height: ${size}px;
        background: ${colors[i % colors.length]};
        border-radius: ${Math.random() > 0.5 ? '50%' : '3px'};
        pointer-events: none;
        z-index: 999;
        animation: confettiFly 1.2s ease-out forwards;
        animation-delay: ${i * 35}ms;
        transform-origin: center;
      `;
      document.body.appendChild(dot);
      dot.addEventListener('animationend', () => dot.remove());
    }
  }

  // Confetti keyframes injected once
  const ks = document.createElement('style');
  ks.textContent = `
    @keyframes confettiFly {
      0%   { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
      100% { transform: translateY(${window.innerHeight * 0.6}px) rotate(720deg) scale(0.3); opacity: 0; }
    }
  `;
  document.head.appendChild(ks);

  let currentPyramidLang = "en";

  function setPyramidLanguage(lang) {
    if (!PYRAMID_I18N[lang]) return;
    currentPyramidLang = lang;
    localStorage.setItem("kubi_lang", lang);
    document.documentElement.lang = lang;
    if (window.KubiTheme && window.KubiTheme.update) window.KubiTheme.update();

    document.querySelectorAll(".lang-btn").forEach(btn => {
      btn.classList.toggle("active", btn.getAttribute("data-lang") === lang);
    });

    const t = PYRAMID_I18N[lang];
    const backLink = document.getElementById("pyramidBackLink");
