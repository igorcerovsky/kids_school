<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rýchle dopĺňanie I / Y | Kubi Kids School</title>

<link rel="stylesheet" href="../css/theme.css">
<script src="../css/theme.js"></script>

<style>
  .word-stage {
    text-align: center;
    padding: 32px 20px;
    margin-bottom: 24px;
  }

  #word {
    font-size: clamp(2.5rem, 8vw, 4rem);
    font-weight: 800;
    margin: 20px 0 30px;
    letter-spacing: 4px;
    color: var(--text);
    font-family: var(--font-sans);
  }

  .choice-row {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  button.choice {
    font-family: inherit;
    font-size: 2rem;
    font-weight: 700;
    width: 80px;
    height: 72px;
    cursor: pointer;
    background: var(--surface);
    border: 2px solid var(--border-strong);
    border-radius: var(--radius-md);
    color: var(--text);
    box-shadow: var(--shadow-sm);
    transition: var(--transition);
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  button.choice:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
    border-color: var(--primary);
    color: var(--primary);
    background: var(--surface-hover);
  }

  button.choice:active {
    transform: translateY(1px);
  }

  #stats {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--text-secondary);
    margin: 16px 0;
  }

  .correctWord {
    color: var(--success) !important;
  }

  .info-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 16px;
    margin-top: 14px;
    font-size: 0.95rem;
    text-align: left;
    color: var(--text-secondary);
  }

  .resetBtn {
    margin-top: 24px;
    padding: 8px 18px;
    font-size: 0.9rem;
    font-weight: 600;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--bg-subtle);
    color: var(--text-muted);
    cursor: pointer;
    transition: var(--transition);
  }

  .resetBtn:hover {
    background: var(--surface-hover);
    color: var(--danger-text);
    border-color: var(--danger-border);
  }
</style>
</head>

<body>

  <!-- Top Navigation -->
  <header class="kubi-top-bar">
    <div class="kubi-nav-left">
      <a href="../index.html" class="kubi-back-link">
        ← Prehľad aktivít
      </a>
      <span class="kubi-page-title">Rýchle dopĺňanie I / Y ⚡</span>
    </div>
    <div class="kubi-nav-right">
      <button class="theme-toggle-btn" aria-label="Prepnúť tému"></button>
    </div>
  </header>

  <main class="app-container">
    <div class="card-panel-elevated word-stage">
      <h1 style="font-size: 1.5rem; font-weight: 800; color: var(--text); margin-bottom: 8px;">
        📝 Doplň správne i / y
      </h1>

      <div id="word">Načítavam...</div>

      <div class="choice-row">
        <button class="choice" onclick="chooseLetter('i')">i</button>
        <button class="choice" onclick="chooseLetter('y')">y</button>
        <button class="choice" onclick="chooseLetter('í')">í</button>
        <button class="choice" onclick="chooseLetter('ý')">ý</button>
      </div>

      <div id="stats"></div>
    </div>

    <div id="slowWords" class="info-card"></div>
    <div id="wrongWords" class="info-card"></div>
    <div id="speedTrend" class="info-card"></div>

    <div style="text-align: center;">
      <button class="resetBtn" onclick="resetProgress()">
        Vynulovať pokrok
      </button>
    </div>
  </main>

<script>

// =====================
// STORAGE
// =====================

const STORAGE_KEY =
"iy_practice_progress_v2";

// =====================
// WORD LIST
// =====================

let words = [

"digestor","diktát","dinosaurus","dioptria","disk",
"diskutovať","dispečer","džudista",
"krokodíl","puding","disciplína",

"hymna","hygiena","hydina",
"hydrant","hyacint",
"ohýbať","mohyla",

"chyba","chýbať",
"chyža","chytiť",

"kyslík","kyslý",

"gymnastika","gymnázium",

"dyňa","dym","dýchať",

"tykadlo","tyčinka",
"týždeň",

"nylon","vinyl",

"lyko","lyže",

"plyn","mlyn",
"plyš","plytký"

];

// =====================
// VARIABLES
// =====================

let stats = {};
let wrongWords = new Set();

let correctCount = 0;
let incorrectCount = 0;

let speedSamples = [];
let recentTimes = [];

let currentWord = "";
let gapPositions = [];
let gapIndex = 0;

let startTime = 0;

// =====================
// LOAD / SAVE
// =====================

function loadProgress() {

let saved =
localStorage.getItem(STORAGE_KEY);

if (saved) {

let data =
JSON.parse(saved);

stats = data.stats;

wrongWords =
new Set(data.wrongWords);

correctCount =
data.correctCount;

incorrectCount =
data.incorrectCount;

speedSamples =
data.speedSamples || [];

recentTimes =
data.recentTimes || [];

} else {

words.forEach(w => {

stats[w] = {
totalTime: 0,
attempts: 0
};

});

}

}

function saveProgress() {

let data = {

stats: stats,

wrongWords:
[...wrongWords],

correctCount:
correctCount,

incorrectCount:
incorrectCount,

speedSamples:
speedSamples,

recentTimes:
recentTimes

};

localStorage.setItem(
STORAGE_KEY,
JSON.stringify(data)
);

}

function resetProgress() {

localStorage.removeItem(
STORAGE_KEY
);

location.reload();

}

// =====================
// WORD SELECTION
// =====================

function getSlowWords() {

return Object.entries(stats)
.sort((a,b) =>
(b[1].totalTime /
Math.max(b[1].attempts,1))
-
(a[1].totalTime /
Math.max(a[1].attempts,1))
)
.slice(0,12)
.map(x => x[0]);

}

function getRandomWord() {

let slowWords =
getSlowWords();

let pool = [...words];

slowWords.forEach(w => {

pool.push(w);
pool.push(w);

});

let word;

do {

word =
pool[Math.floor(
Math.random() * pool.length
)];

} while (!hasGap(word));

return word;

}

function hasGap(word) {

return [...word].some(
c => "iyíý".includes(c)
);

}

// =====================
// GAP CREATION
// =====================

function createGaps(word) {

gapPositions = [];

for (let i=0;i<word.length;i++) {

if ("iyíý".includes(word[i])) {

gapPositions.push(i);

}

}

gapIndex = 0;

let chars = word.split("");

gapPositions.forEach(pos => {

chars[pos] = "_";

});

return chars.join("");

}

// =====================
// SHOW WORD
// =====================

function showWord() {

currentWord =
getRandomWord();

let wordDiv =
document.getElementById("word");

wordDiv.classList.remove(
"correctWord"
);

wordDiv.textContent =
createGaps(currentWord);

speakWord();

startTime =
performance.now();

}

// =====================
// LETTER INPUT
// =====================

function chooseLetter(letter) {

let correctLetter =
currentWord[
gapPositions[gapIndex]
];

if (letter === correctLetter) {

fillLetter(letter);

gapIndex++;

if (
gapIndex ===
gapPositions.length
) {

finishWord();

}

} else {

incorrectCount++;

wrongWords.add(
currentWord
);

updateStats();
saveProgress();

}

}

function fillLetter(letter) {

let wordDiv =
document.getElementById("word");

let chars =
wordDiv.textContent.split("");

chars[
gapPositions[gapIndex]
] = letter;

wordDiv.textContent =
chars.join("");

}

// =====================
// FINISH WORD
// =====================

function finishWord() {

let endTime =
performance.now();

let time =
(endTime - startTime)/1000;

let perLetter =
time / gapPositions.length;

stats[currentWord]
.totalTime += perLetter;

stats[currentWord]
.attempts++;

recentTimes.push(perLetter);

if (recentTimes.length === 10) {

let avg =
recentTimes.reduce((a,b)=>a+b,0)
/ recentTimes.length;

speedSamples.push(avg);

if (speedSamples.length > 20) {

speedSamples.shift();

}

recentTimes = [];

}

correctCount++;

updateStats();
saveProgress();

let wordDiv =
document.getElementById("word");

wordDiv.textContent =
currentWord;

wordDiv.classList.add(
"correctWord"
);

setTimeout(
showWord,
1000
);

}

// =====================
// SPEECH
// =====================

function speakWord() {

let utterance =
new SpeechSynthesisUtterance(
currentWord
);

utterance.lang = "sk-SK";

speechSynthesis.cancel();

speechSynthesis.speak(
utterance
);

}

// =====================
// DISPLAY
// =====================

function updateStats() {

let total =
correctCount +
incorrectCount;

let accuracy =
total > 0
? (correctCount / total * 100).toFixed(1)
: 0;

document.getElementById("stats")
.textContent =
"Correct: "
+ correctCount +
" | Incorrect: "
+ incorrectCount +
" | Accuracy: "
+ accuracy + "%";

displaySlowWords();
displayWrongWords();
displaySpeedTrend();

}

function displaySlowWords() {

document.getElementById("slowWords")
.innerHTML =
"<b>12 Slowest Words:</b><br>"
+ getSlowWords().join(", ");

}

function displayWrongWords() {

document.getElementById("wrongWords")
.innerHTML =
"<b>Incorrect Words:</b><br>"
+ [...wrongWords].join(", ");

}

function displaySpeedTrend() {

document.getElementById("speedTrend")
.innerHTML =
"<b>Speed trend (sec/letter):</b><br>"
+ speedSamples
.map(v => v.toFixed(2))
.join(" → ");

}

// =====================
// START
// =====================

window.onload = () => {

loadProgress();

updateStats();

showWord();

};

</script>

</body>
</html>
