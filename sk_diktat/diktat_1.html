<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slovenský Diktát | Kubi Kids School</title>

<link rel="stylesheet" href="../css/theme.css">
<script src="../css/theme.js"></script>

<style>
  .dictation-stage {
    text-align: center;
    padding: 36px 20px;
    max-width: 600px;
    margin: 0 auto;
  }

  .audio-button-wrap {
    margin: 20px 0 24px;
  }

  .dictation-input {
    font-size: clamp(1.4rem, 4vw, 1.8rem) !important;
    text-align: center;
    width: 100% !important;
    max-width: 380px !important;
    padding: 12px 18px !important;
    border-radius: var(--radius-md) !important;
    border: 2px solid var(--border-strong) !important;
    background: var(--surface) !important;
    color: var(--text) !important;
    margin-bottom: 20px;
  }

  #result {
    font-size: 1.25rem;
    font-weight: 700;
    min-height: 36px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .correct {
    color: var(--success);
  }

  .incorrect {
    color: var(--danger);
  }

  #score {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text-secondary);
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
</style>
</head>

<body>

  <!-- Top Navigation -->
  <header class="kubi-top-bar">
    <div class="kubi-nav-left">
      <a href="../index.html" class="kubi-back-link">
        ← Prehľad aktivít
      </a>
      <span class="kubi-page-title">Slovenský Diktát ✍️</span>
    </div>
    <div class="kubi-nav-right">
      <button class="theme-toggle-btn" aria-label="Prepnúť tému"></button>
    </div>
  </header>

  <main class="app-container">
    <div class="card-panel-elevated dictation-stage">
      <h1 style="font-size: 1.6rem; font-weight: 800; color: var(--text); margin-bottom: 6px;">
        ✍️ Precvičovanie pravopisu
      </h1>
      <p style="color: var(--text-secondary); font-size: 0.95rem;">
        Vypočuj si slovo a napíš ho bez chyby.
      </p>

      <div class="audio-button-wrap">
        <button class="btn btn-primary btn-lg" onclick="speakWord()">
          🔊 Prehrať slovo
        </button>
      </div>

      <div>
        <input
          type="text"
          id="answer"
          class="dictation-input"
          placeholder="Napíš slovo..."
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          onkeydown="if(event.key==='Enter') checkWord()"
        />
      </div>

      <div id="result"></div>

      <div>
        <button class="btn btn-secondary" onclick="nextWord()">
          ➡️ Ďalšie slovo
        </button>
      </div>

      <div id="score">Skóre: 0 / 0</div>
    </div>
  </main>

<script>

// ALL WORDS COMBINED

let words = [

"digestor","diktát","dinosaurus","dioptria","disk",
"diskutovať","dispečer","džudista","Edita",
"krokodíl","puding","disciplína","dirigent",

"Martin","Tibor","tiger","tikať","tik-tak",
"tím","Timea","tip","tipovať","tip-top",
"títo","titul","Valentín",

"Bonifác","Denis","Dôminik","Monika",
"tenis","tenisky","Veronika",

"klíma","klimatizácia","milimeter",
"licencia","liga","liter",
"literatúra","republika",

// NEW WORDS

"hi-hi","hijó","híkať","Hilda",
"história","historik","hit","hitparáda",

"architekt","archív","chi-chi",
"chichot","chichotať sa",
"chirurg","chirurgia",

"kibicovať","kikirikí","kilo",
"kilogram","kilometer","kimono",
"kino","kinofilm","kinosála",
"kivi","treningy","panika",

"angína","Brigita","gigabajt",
"gigant","girlanda","gitara",
"gitovať","Gizela","legíny",
"logika","Margita","Regina",
"gibon",
"hymna",
"hyj?",
"hygiena",
"hydina",
"hýbať sa",
"hydrant",
"hyacint",
"ohýbať",
"mohyla",
"pohyb",

"chytro",
"chyba",
"chýbať",
"chýr",
"chyža",
"chytiť",
"chýl",
"pochybovať",

"kýchnuť",
"kyslé",
"kyslý",
"kyslík",
"kysnuté",
"zakývať",
"kývadlo",
"kypí",

"gymnastika",
"gymnázium",

"dyňa",
"dym",
"dýchať",
"oddych",
"dýka",
"dýchovka",
"Londýn",

"dotyk",
"tykadlo",
"tykať niekomu",
"týrajú",
"tyč",
"tyčinka",
"motýľ",
"týždeň",
"tyrkysový",
"kostým",

"nylon",
"synonymá",
"vinyl",
"nymfa",

"lyko",
"lykožrút",
"lyže",
"lysý",

"plyn",
"mlyn",
"plyš",
"blýskať sa",
"blyšťal sa",
"plytký"

];

// Shuffle words
words = words.sort(() => Math.random() - 0.5);

let currentIndex = 0;
let correctCount = 0;
let totalCount = 0;

function speakWord() {

    const utterance =
        new SpeechSynthesisUtterance(words[currentIndex]);

    utterance.lang = "sk-SK";

    speechSynthesis.speak(utterance);
}

function checkWord() {

    const input =
        document.getElementById("answer")
        .value.trim();

    const correctWord =
        words[currentIndex];

    const result =
        document.getElementById("result");

    totalCount++;

    if (input === correctWord) {

        result.textContent = "✅ Správne!";
        result.className = "correct";

        correctCount++;

    } else {

        result.textContent =
            "❌ Nesprávne! Správne slovo: "
            + correctWord;

        result.className = "incorrect";
    }

    updateScore();
}

function nextWord() {

    currentIndex++;

    if (currentIndex >= words.length) {

        words = words.sort(() => Math.random() - 0.5);
        currentIndex = 0;

    }

    document.getElementById("answer").value = "";
    document.getElementById("result").textContent = "";

    speakWord();
}

function updateScore() {

    document.getElementById("score")
        .textContent =
        "Score: "
        + correctCount
        + " / "
        + totalCount;
}

// Start automatically
window.onload = () => {

    speakWord();

};

</script>

</body>
</html>
