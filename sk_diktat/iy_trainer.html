<!DOCTYPE html>
<html lang="sk">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I / Y Trenažér | Vybrané slová | Kubi Kids School</title>

  <link rel="stylesheet" href="../css/theme.css">
  <script src="../css/theme.js"></script>

  <style>
    /* Compact Single-Screen Layout matching Math Trainer */
    body {
      overflow-x: hidden;
    }

    .app-container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 10px 14px;
    }

    /* Top Navigation bar compact */
    .kubi-top-bar {
      padding: 6px 14px;
      min-height: 44px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Compact Toolbar */
    .trainer-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      padding: 6px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      margin-bottom: 10px;
    }

    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
      font-size: 0.82rem;
      color: var(--text);
    }

    .toolbar-setting-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.82rem;
      color: var(--text);
    }

    .preset-btn {
      font-size: 0.78rem;
      padding: 3px 8px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-weight: 600;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      color: var(--text);
      transition: var(--transition);
      user-select: none;
    }

    .preset-btn:hover {
      border-color: var(--border-strong);
    }

    .preset-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .letter-btn {
      min-width: 28px;
      text-align: center;
      font-weight: 700;
    }

    .toolbar-input {
      width: 48px !important;
      min-width: 46px !important;
      height: 28px !important;
      padding: 2px 4px !important;
      font-size: 0.84rem !important;
      font-weight: 600 !important;
      font-family: var(--font-sans) !important;
      text-align: center !important;
      border: 1px solid var(--border-strong) !important;
      border-radius: var(--radius-sm) !important;
      background: var(--surface) !important;
      color: var(--text) !important;
      box-sizing: border-box !important;
    }

    .toolbar-select {
      height: 28px !important;
      padding: 2px 8px !important;
      font-size: 0.82rem !important;
      font-family: var(--font-sans) !important;
      border: 1px solid var(--border-strong) !important;
      border-radius: var(--radius-sm) !important;
      background: var(--surface) !important;
      color: var(--text) !important;
      box-sizing: border-box !important;
    }

    /* Collapsible Settings Drawer */
    .settings-drawer {
      margin-bottom: 10px;
      padding: 10px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 0.82rem;
    }

    .settings-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    /* 3-Column Dashboard Grid */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 240px minmax(320px, 1fr) 280px;
      gap: 12px;
      align-items: stretch;
    }

    .panel-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 12px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
    }

    /* Left Panel: Word Matrix */
    .matrix-panel {
      align-items: center;
      justify-content: flex-start;
      background: var(--bg-subtle);
      width: 100%;
      box-sizing: border-box;
      overflow: visible;
      min-height: min-content;
    }

    .panel-title {
      font-size: 0.86rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 6px;
      text-align: center;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .word-matrix {
      background: transparent;
      padding: 2px;
      margin: 4px auto 0;
      user-select: none;
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
      flex-shrink: 0;
    }

    .matrix-cell {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 2.5px;
      background-color: var(--border-strong);
      transition: all 0.15s ease;
      cursor: pointer;
      box-sizing: border-box;
      position: relative;
      min-width: 0;
    }

    .matrix-cell:hover {
      transform: scale(1.4);
      z-index: 10;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
    }

    @keyframes activePulse {
      0%, 100% {
        transform: scale(1.18);
        box-shadow: 0 0 0 2px var(--primary), 0 0 8px var(--primary);
        z-index: 5;
      }
      50% {
        transform: scale(1.05);
        box-shadow: 0 0 0 3px var(--primary), 0 0 12px var(--primary);
        z-index: 5;
      }
    }

    .matrix-cell.active-target {
      animation: activePulse 1.5s infinite ease-in-out;
      border: 1.5px solid #ffffff !important;
      z-index: 4;
    }

    .matrix-cell.is-slow::after {
      content: "";
      position: absolute;
      top: 1px;
      right: 1px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background-color: #f59e0b;
      box-shadow: 0 0 3px #f59e0b;
      z-index: 2;
    }

    .matrix-legend {
      margin-top: 6px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex-shrink: 0;
    }

    #hovered-word-info {
      margin-top: 6px;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text-secondary);
      height: 38px;
      min-height: 38px;
      max-height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
      background: var(--surface);
      border-radius: var(--radius-sm);
      padding: 2px 6px;
      border: 1px solid var(--border);
      line-height: 1.25;
      flex-shrink: 0;
      overflow: hidden;
      box-sizing: border-box;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      color: var(--text-secondary);
      font-weight: 600;
    }

    .legend-swatch {
      width: 42px;
      height: 9px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .legend-swatch-gray {
      background: var(--border-strong);
    }

    .legend-swatch-teal,
    .legend-swatch-red,
    .legend-swatch-blue {
      display: flex;
      gap: 1px;
      overflow: hidden;
      border-radius: 2px;
    }

    .ls-step {
      flex: 1;
      height: 100%;
    }

    /* Center Panel: Active Problem */
    .center-panel {
      align-items: center;
      justify-content: center;
      text-align: center;
      background: var(--surface-elevated);
      padding: 16px 20px;
    }

    .problem-display {
      font-size: clamp(2.2rem, 5vw, 3.2rem);
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--text);
      min-height: 1.2em;
      margin: 6px 0 16px;
      font-family: var(--font-sans);
      transition: color 0.2s;
      word-break: break-word;
    }

    .correctWord {
      color: var(--success) !important;
    }

    .choices-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 16px;
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
    }

    .button-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      justify-content: center;
      width: fit-content;
      position: relative;
    }

    button.choice-help {
      width: 74px;
      height: 150px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      border: 2px solid #3b82f6;
      background: rgba(59, 130, 246, 0.08);
      color: #2563eb;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
      cursor: pointer;
    }

    button.choice-help:hover {
      border-color: #2563eb;
      background: rgba(59, 130, 246, 0.18);
      color: #1d4ed8;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.28);
      transform: translateY(-2px);
    }

    [data-theme="dark"] button.choice-help {
      border-color: #60a5fa;
      background: rgba(96, 165, 250, 0.12);
      color: #93c5fd;
    }

    [data-theme="dark"] button.choice-help:hover {
      border-color: #93c5fd;
      background: rgba(96, 165, 250, 0.22);
      color: #bfdbfe;
      box-shadow: 0 4px 14px rgba(96, 165, 250, 0.32);
    }

    .help-q {
      font-size: 2.3rem;
      font-weight: 800;
      line-height: 1;
    }

    .help-lbl {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      opacity: 0.9;
    }

    button.choice {
      font-family: inherit;
      font-weight: 700;
      font-size: 1.85rem;
      width: 74px;
      height: 70px;
      cursor: pointer;
      background: var(--surface);
      border: 2px solid var(--border-strong);
      border-radius: var(--radius-md);
      color: var(--text);
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
    }

    button.choice:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: var(--primary);
      color: var(--primary);
      background: var(--surface-hover);
    }

    button.choice:active {
      transform: translateY(1px);
    }

    button.choice.locked {
      opacity: 0.35;
      pointer-events: none;
      cursor: default;
    }

    @keyframes pulse-red {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.5);
      }
      50% {
        box-shadow: 0 0 0 10px rgba(220, 38, 38, 0);
      }
    }

    .center-circle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--danger);
      cursor: crosshair;
      z-index: 20;
      transition: background 0.25s, box-shadow 0.25s;
      animation: pulse-red 1.4s infinite;
    }

    .center-circle.unlocked {
      background: var(--success);
      animation: none;
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.35);
      pointer-events: none;
    }

    @keyframes shake {
      0%, 100% {
        transform: translateX(0);
      }
      25% {
        transform: translateX(-5px);
        background-color: var(--danger-subtle);
        border-color: var(--danger);
        color: var(--danger-text);
      }
      50% {
        transform: translateX(5px);
        background-color: var(--danger-subtle);
        border-color: var(--danger);
        color: var(--danger-text);
      }
      75% {
        transform: translateX(-5px);
        background-color: var(--danger-subtle);
        border-color: var(--danger);
        color: var(--danger-text);
      }
    }

    .wrong-animation {
      animation: shake 0.4s;
    }

    .controls-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }

    .btn-sm {
      padding: 5px 12px;
      font-size: 0.85rem;
    }

    #feedback {
      min-height: 26px;
      font-size: 1.02rem;
      font-weight: 800;
      margin-top: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #feedback.correct {
      color: var(--success);
      animation: pop 0.25s ease-out;
    }

    #feedback.wrong {
      color: var(--danger);
      animation: shake 0.25s ease-out;
    }

    #feedback.help {
      color: #2563eb;
      animation: pop 0.25s ease-out;
    }

    [data-theme="dark"] #feedback.help {
      color: #60a5fa;
    }

    @keyframes pop {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    #stats {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-secondary);
      margin-top: 6px;
    }

    /* Right Panel: Analytics */
    .right-analytics-panel {
      font-size: 0.82rem;
      gap: 8px;
    }

    .info-box-compact {
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 6px 8px;
      line-height: 1.35;
      text-align: left;
      max-height: 90px;
      overflow-y: auto;
    }

    .tag-wrong {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: var(--danger-subtle);
      border: 1px solid var(--danger-border);
      color: var(--danger-text);
      padding: 1px 5px;
      border-radius: var(--radius-sm);
      margin: 1px;
      font-weight: 600;
      font-size: 0.76rem;
    }

    .tag-help {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.35);
      color: #2563eb;
      padding: 1px 5px;
      border-radius: var(--radius-sm);
      margin: 1px;
      font-weight: 600;
      font-size: 0.76rem;
    }

    [data-theme="dark"] .tag-help {
      background: rgba(96, 165, 250, 0.18);
      border-color: rgba(96, 165, 250, 0.4);
      color: #93c5fd;
    }

    .tag-slow {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: var(--warning-subtle);
      border: 1px solid var(--warning-border);
      color: var(--warning-text);
      padding: 1px 5px;
      border-radius: var(--radius-sm);
      margin: 1px;
      font-weight: 600;
      font-size: 0.76rem;
    }

    [data-theme="dark"] .tag-slow {
      background: rgba(245, 158, 11, 0.18);
      border-color: rgba(245, 158, 11, 0.4);
      color: #fbbf24;
    }

    canvas#speedChart {
      width: 100%;
      height: 105px;
      border-radius: var(--radius-sm);
      background: var(--surface);
      border: 1px solid var(--border);
      display: block;
    }

    /* Responsive adjustments */
    @media (max-width: 960px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
      }
      .matrix-panel {
        order: 2;
      }
      .center-panel {
        order: 1;
      }
      .right-analytics-panel {
        order: 3;
      }
    }
  </style>
</head>

<body>

  <!-- Top Navigation Bar with Tabs and Theme Toggle -->
  <header class="kubi-top-bar">
    <nav class="kubi-nav-tabs" aria-label="Navigation Tabs">
      <a href="../index.html" class="kubi-tab-link">← Prehľad aktivít</a>
      <a href="iy_trainer.html" class="kubi-tab-link active">📘 I / Y Trenažér</a>
    </nav>
    <div class="nav-actions">
      <button class="theme-toggle-btn" aria-label="Prepnúť tému"></button>
    </div>
  </header>

  <main class="app-container">

    <!-- Slim Toolbar: Letter Group Selector + Sub-filter + Settings -->
    <section class="trainer-toolbar">
      <!-- Letter Groups -->
      <div class="toolbar-group">
        <span style="font-weight: 700; margin-right: 2px;">Písmeno:</span>
        <button type="button" class="preset-btn letter-btn active" data-group="all" onclick="setLetterGroup('all')">Všetky</button>
        <button type="button" class="preset-btn letter-btn" data-group="B" onclick="setLetterGroup('B')">B</button>
        <button type="button" class="preset-btn letter-btn" data-group="M" onclick="setLetterGroup('M')">M</button>
        <button type="button" class="preset-btn letter-btn" data-group="P" onclick="setLetterGroup('P')">P</button>
        <button type="button" class="preset-btn letter-btn" data-group="R" onclick="setLetterGroup('R')">R</button>
        <button type="button" class="preset-btn letter-btn" data-group="S" onclick="setLetterGroup('S')">S</button>
        <button type="button" class="preset-btn letter-btn" data-group="V" onclick="setLetterGroup('V')">V</button>
        <button type="button" class="preset-btn letter-btn" data-group="Z" onclick="setLetterGroup('Z')">Z</button>
        <button type="button" class="preset-btn letter-btn" data-group="L" onclick="setLetterGroup('L')">L</button>
        <button type="button" class="preset-btn letter-btn" data-group="C" onclick="setLetterGroup('C')">C</button>
        <button type="button" class="preset-btn letter-btn" data-group="F" onclick="setLetterGroup('F')">F</button>
      </div>

      <!-- Sub-filter & Settings Toggle -->
      <div class="toolbar-group">
        <button type="button" class="preset-btn active" data-sub="all" onclick="setSubFilter('all')" id="subFilterAll">Všetky slová</button>
        <button type="button" class="preset-btn" data-sub="vybrane" onclick="setSubFilter('vybrane')" id="subFilterVybrane">Vybrané (y/ý)</button>
        <button type="button" class="preset-btn" data-sub="makke" onclick="setSubFilter('makke')" id="subFilterMakke">Mäkké (i/í)</button>
        <button type="button" class="preset-btn" id="settingsToggleBtn" onclick="toggleSettingsDrawer()">⚙️ Nastavenia</button>
      </div>
    </section>

    <!-- Collapsible Settings Drawer -->
    <div id="settingsDrawer" class="settings-drawer" style="display: none;">
      <div class="settings-row">
        <!-- Letter Group in Settings -->
        <div class="toolbar-setting-item">
          <label for="letterGroupSelect"><b>Skupina:</b></label>
          <select id="letterGroupSelect" class="toolbar-select" onchange="setLetterGroup(this.value)">
            <option value="all">Všetky skupiny (B, M, P, R, S, V, Z, L, C, F)</option>
            <option value="B">B — by, bylina, bystrý, bývať, kobyla...</option>
            <option value="M">M — my, mykať, mýliť sa, myslieť, myš...</option>
            <option value="P">P — pýcha, pýtať sa, pytliak, kopyto, pysk...</option>
            <option value="R">R — ryba, rýchly, rys, ryť, koryto, ryža...</option>
            <option value="S">S — syn, sypať, syr, syseľ, sýty, sychravý...</option>
            <option value="V">V — vy, vysoký, zvyk, vydra, výr...</option>
            <option value="Z">Z — jazyk, ozývať sa, pozývať, vyzývať...</option>
            <option value="L">L — lyko, lýtko, lyžica, lyže, plyn, mlyn...</option>
            <option value="C">C — cyklista, bicykel, cyklus, Cyril, Cyrila...</option>
            <option value="F">F — fyzika, fyzik, fyzický, film, finta...</option>
          </select>
        </div>

        <!-- Practice Mode -->
        <div class="toolbar-setting-item">
          <label for="practiceModeSelect"><b>Režim:</b></label>
          <select id="practiceModeSelect" class="toolbar-select" onchange="onPracticeModeChange()">
            <option value="normal">Normálny (adaptívny cyklus)</option>
            <option value="slow">Iba najpomalšie</option>
            <option value="wrong">Iba chybné</option>
          </select>
        </div>

        <!-- Graduation Threshold -->
        <div class="toolbar-setting-item">
          <span>Vyradenie po:</span>
          <input type="number" id="successThreshold" class="toolbar-input" value="4" min="1" max="20" onchange="onSettingsChange()">
          <span>úspechoch</span>
        </div>

        <!-- Slow N -->
        <div class="toolbar-setting-item">
          <span>Pomalé N:</span>
          <input type="number" id="slowCountInput" class="toolbar-input" value="5" min="1" max="15" onchange="onSettingsChange()">
        </div>

        <!-- Auto audio -->
        <div class="toolbar-setting-item">
          <label style="display:inline-flex; align-items:center; gap:5px; cursor:pointer;" title="Automaticky prehrať výslovnosť slova pri zobrazení">
            <input type="checkbox" id="autoAudioCheckbox" checked onchange="saveProgress()" style="accent-color:var(--primary); cursor:pointer;">
            <span>🔊 Automaticky prehrať slovo</span>
          </label>
        </div>
      </div>
    </div>

    <!-- 3-Column Single-Screen Dashboard -->
    <div class="dashboard-grid">

      <!-- LEFT COLUMN: Word Matrix & Mastery Progress -->
      <section class="panel-card matrix-panel">
        <div class="panel-title" id="matrixTitle">
          📊 Pokrok slov
        </div>

        <div id="wordMatrix" class="word-matrix"></div>

        <!-- Micro-Legend -->
        <div class="matrix-legend">
          <div class="legend-row">
            <div class="legend-swatch legend-swatch-gray"></div>
            <span>Neprecvičené</span>
          </div>
          <div class="legend-row">
            <div class="legend-swatch legend-swatch-teal">
              <div class="ls-step" style="background:hsl(174,70%,82%)"></div>
              <div class="ls-step" style="background:hsl(174,70%,72%)"></div>
              <div class="ls-step" style="background:hsl(174,70%,62%)"></div>
              <div class="ls-step" style="background:hsl(174,70%,52%)"></div>
              <div class="ls-step" style="background:hsl(174,70%,42%)"></div>
              <div class="ls-step" style="background:hsl(174,70%,32%)"></div>
            </div>
            <span>Správne (1–6)</span>
          </div>
          <div class="legend-row">
            <div class="legend-swatch legend-swatch-red">
              <div class="ls-step" style="background:hsl(0,70%,82%)"></div>
              <div class="ls-step" style="background:hsl(0,70%,72%)"></div>
              <div class="ls-step" style="background:hsl(0,70%,62%)"></div>
              <div class="ls-step" style="background:hsl(0,70%,52%)"></div>
              <div class="ls-step" style="background:hsl(0,70%,42%)"></div>
              <div class="ls-step" style="background:hsl(0,70%,32%)"></div>
            </div>

    // ACTIVE SELECTION STATE
    let currentLetterGroup = "all"; // "all" or "B", "M", "P", "R", "S", "V", "Z", "L", "C", "F"
    let currentSubFilter = "all";   // "all", "vybrane", "makke"
    let words = [];

    // Helper: checks if word has at least one valid gap for the active group
    // (Diphthongs ia, ie, iu are NEVER gapped, written as is)
    function hasValidGap(word, group) {
      let allowed = (group === 'all') ? "bmprsvzlcf" : group.toLowerCase();
      for (let i = 0; i < word.length; i++) {
        if (i > 0 && allowed.includes(word[i - 1].toLowerCase()) && "iyíý".includes(word[i])) {
          let nextChar = (i + 1 < word.length) ? word[i + 1].toLowerCase() : '';
          if (nextChar && "aeuáéú".includes(nextChar)) {
            continue; // Diphthong (ia, ie, iu) - written as is, not gapped
          }
          return true;
        }
      }
      return false;
    }

    function computeWordPool(group, sub) {
      let pool = [];
      let letters = (group === "all") ? ["B", "M", "P", "R", "S", "V", "Z", "L", "C", "F"] : [group];

      letters.forEach(letter => {
        let entry = VYBRANE_DATA[letter];
        if (!entry) return;
        if (sub === "all" || sub === "vybrane") {
          pool.push(...entry.vybrane);
        }
        if (sub === "all" || sub === "makke") {
          pool.push(...entry.makke);
        }
      });

      // Filter: only keep words that have at least one valid gap for the active group
      // (Diphthongs ia, ie, iu are never gapped and are written as is)
      pool = pool.filter(w => hasValidGap(w, group));

      // Deduplicate words
      return Array.from(new Set(pool));
    }

    // STATE VARIABLES
    const SLOW_FEATURED_EVERY = 5;
    const SLOW_SPEED_MULTIPLIER = 1.8;

    let stats = {};
    let wrongMap = {};

    // LOAD PROGRESS & SETTINGS
    function loadProgress() {
      let saved = localStorage.getItem(STORAGE_KEY);
      let today = new Date().toLocaleDateString('en-CA');

      if (saved) {
        let data = JSON.parse(saved);
        stats = data.stats || {};
        wrongMap = data.wrongMap || {};
        helpMap = data.helpMap || {};
        matrixCount = data.matrixCount || {};
        wrongCount = data.wrongCount || {};
        helpCount = data.helpCount || 0;

        if (data.lastPlayedDate !== today) {
          correctCount = 0;
          incorrectCount = 0;
          helpCount = 0;
          speedSamples = [];
        } else {
          correctCount = data.correctCount || 0;
          incorrectCount = data.incorrectCount || 0;
          helpCount = data.helpCount || 0;
          speedSamples = data.speedSamples || [];
        }
        recentTimes = data.recentTimes || [];

        if (data.threshold) {
          const threshEl = document.getElementById("successThreshold");
          if (threshEl) threshEl.value = data.threshold;
        }
        if (data.practiceMode) {
          const modeEl = document.getElementById("practiceModeSelect");
          if (modeEl) modeEl.value = data.practiceMode;
        }
        if (typeof data.autoAudio === "boolean") {
          const audioEl = document.getElementById("autoAudioCheckbox");
          if (audioEl) audioEl.checked = data.autoAudio;
        }
        if (data.letterGroup) {
          currentLetterGroup = data.letterGroup;
        }
        if (data.subFilter) {
          currentSubFilter = data.subFilter;
        }
      }

      applyFilterState(false);
    }

    // SAVE PROGRESS & SETTINGS
    function saveProgress() {
      let data = {
        stats: stats,
        wrongMap: wrongMap,
        helpMap: helpMap,
        matrixCount: matrixCount,
        wrongCount: wrongCount,
        helpCount: helpCount,
        correctCount: correctCount,
        incorrectCount: incorrectCount,
        speedSamples: speedSamples,
        recentTimes: recentTimes,
        threshold: parseInt(document.getElementById("successThreshold")?.value || "4", 10),
        practiceMode: document.getElementById("practiceModeSelect")?.value || "normal",
        autoAudio: document.getElementById("autoAudioCheckbox")?.checked ?? true,
        letterGroup: currentLetterGroup,
        subFilter: currentSubFilter,
        lastPlayedDate: new Date().toLocaleDateString('en-CA')
      };

      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    // LETTER GROUP & SUB-FILTER SWITCHING
    function setLetterGroup(group, doSave = true) {
      currentLetterGroup = group;
      applyFilterState(doSave);
    }

    function setSubFilter(sub, doSave = true) {
      currentSubFilter = sub;
      applyFilterState(doSave);
    }

    function applyFilterState(doSave = true) {
      // Sync toolbar group buttons
      document.querySelectorAll(".letter-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.group === currentLetterGroup);
      });

      // Sync select dropdown in settings
      const selectEl = document.getElementById("letterGroupSelect");
      if (selectEl) selectEl.value = currentLetterGroup;

      // Sync sub-filter buttons
      document.querySelectorAll("[data-sub]").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.sub === currentSubFilter);
      });

      words = computeWordPool(currentLetterGroup, currentSubFilter);

      // Ensure stats and matrixCount exist for all current words
      words.forEach(w => {
        if (!stats[w]) stats[w] = { totalTime: 0, attempts: 0 };
        if (matrixCount[w] === undefined) matrixCount[w] = 0;
      });

      // Update matrix title
      const titleEl = document.getElementById("matrixTitle");
      if (titleEl) {
        let label = (currentLetterGroup === "all") ? "Všetky vybrané slová" : `Vybrané slová po ${currentLetterGroup}`;
        titleEl.textContent = `📊 Pokrok: ${label} (${words.length})`;
      }

      recentWords = [];
      renderMatrix();

      if (!words.includes(currentWord)) {
        showWord();
      } else {
        highlightActiveCell();
      }

      if (doSave) saveProgress();
    }

    // SETTINGS DRAWER TOGGLE
    function toggleSettingsDrawer() {
      const drawer = document.getElementById("settingsDrawer");
      const btn = document.getElementById("settingsToggleBtn");
      if (drawer.style.display === "none" || !drawer.style.display) {
        drawer.style.display = "flex";
        btn.classList.add("active");
      } else {
        drawer.style.display = "none";
        btn.classList.remove("active");
      }
    }

    function onSettingsChange() {
      saveProgress();
      renderMatrix();
      displaySlowWords();
    }

    function onPracticeModeChange() {
      saveProgress();
      showWord();
    }

    // PAUSE / RESUME CONTROLS
    function pauseTrainer() {
      if (isPaused) return;
      isPaused = true;
      clearInactivityTimer();
      pauseStart = performance.now();

      const pauseBtn = document.getElementById("pauseBtn");
      if (pauseBtn) pauseBtn.innerHTML = "▶️ Pokračovať";

      const wordDiv = document.getElementById("word");
      if (wordDiv) {
        wordDiv.textContent = "Pauza ⏸";
        wordDiv.classList.remove("correctWord");
      }

      document.querySelectorAll('button.choice').forEach(b => b.classList.add('locked'));
      buttonsEnabled = false;

      const circle = document.getElementById('centerCircle');
      if (circle) {
        circle.classList.remove('unlocked');
        circle.style.pointerEvents = 'none';
      }

      highlightActiveCell();
    }

    function resumeTrainer() {
      if (!isPaused) return;
      isPaused = false;

      if (pauseStart !== 0) {
        totalPausedTime += performance.now() - pauseStart;
        pauseStart = 0;
      }

      const pauseBtn = document.getElementById("pauseBtn");
      if (pauseBtn) pauseBtn.innerHTML = "⏸ Pauza";

      const wordDiv = document.getElementById("word");
      if (wordDiv && currentWord) {
        wordDiv.textContent = createGaps(currentWord);
      }

      buttonsEnabled = false;
      const circle = document.getElementById('centerCircle');
      if (circle) {
        circle.classList.remove('unlocked');
        circle.style.pointerEvents = 'auto';
        if (circle.matches(':hover')) {
          unlockButtons();
        }
      }

      highlightActiveCell();
      resetInactivityTimer();
    }

    function togglePause() {
      if (isPaused) {
        resumeTrainer();
      } else {
        pauseTrainer();
      }
    }

    // TETRIS CLEAR (Subtract 1 across current pool once all words hit >= 1)
    function tetrisCheck() {
      let allFilled = words.every(w => (matrixCount[w] || 0) >= 1);
      if (allFilled) {
        words.forEach(w => {
          matrixCount[w] = Math.max(0, (matrixCount[w] || 0) - 1);
        });
      }
    }

    function matrixCountIncrement(w) {
      matrixCount[w] = (matrixCount[w] || 0) + 1;
      tetrisCheck();
    }

    // DAILY HISTORY
    function saveDailyHistory() {
      let today = new Date().toLocaleDateString('en-CA');
      let history = JSON.parse(localStorage.getItem(DAILY_KEY) || "{}");

      let total = correctCount + incorrectCount;
      let accuracy = total > 0 ? (correctCount / total * 100).toFixed(1) : 0;

      let avgSpeed = speedSamples.length > 0
        ? (speedSamples.reduce((a, b) => a + b, 0) / speedSamples.length).toFixed(2)
        : "-";

      history[today] = {
        accuracy: accuracy,
        speed: avgSpeed
      };

      localStorage.setItem(DAILY_KEY, JSON.stringify(history));
      displayDailyHistory();
    }

    function displayDailyHistory() {
      let history = JSON.parse(localStorage.getItem(DAILY_KEY) || "{}");
      let lines = [];

      for (let date in history) {
        let h = history[date];
        lines.push(date + " | Presnosť: " + h.accuracy + "% | Rýchlosť: " + h.speed + " s/písmeno");
      }

      document.getElementById("dailyHistory").innerHTML =
        "<b>Denná história:</b><br>" +
        (lines.length > 0 ? lines.join("<br>") : "Zatiaľ žiadne záznamy.");
    }

    // RESET ALL PROGRESS
    function resetProgress() {
      if (confirm("Naozaj chceš vynulovať celý štatistický pokrok?")) {
        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem(DAILY_KEY);
        location.reload();
      }
    }

    // INACTIVITY TIMER (Auto-pause after 20s of inactivity)
    function resetInactivityTimer() {
      if (inactivityTimer) {
        clearTimeout(inactivityTimer);
        inactivityTimer = null;
      }
      if (!isPaused) {
        inactivityTimer = setTimeout(() => {
          if (!isPaused) {
            pauseTrainer();
          }
        }, INACTIVITY_TIMEOUT_MS);
      }
    }

    function clearInactivityTimer() {
      if (inactivityTimer) {
        clearTimeout(inactivityTimer);
        inactivityTimer = null;
      }
    }

    // Keep inactivity timer reset during active user interactions
    ["pointerdown", "keydown"].forEach(evt => {
      document.addEventListener(evt, () => {
        if (!isPaused) {
          resetInactivityTimer();
        }
      }, { passive: true });
    });

    // TAB VISIBILITY SWITCH HANDLING (Tracks pause duration & auto-pauses when backgrounded)
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        if (!isPaused) {
          pauseStart = performance.now();
        }
      } else {
        if (!isPaused) {
          if (pauseStart !== 0) {
            totalPausedTime += performance.now() - pauseStart;
            pauseStart = 0;
          }
          resetInactivityTimer();
        }
      }
    });

    // GAP GENERATOR (Gaps i, y, í, ý preceded by target consonants)
    // NEVER gap diphthongs (ia, ie, iu) - they remain written as is (e.g. "myšlienka" -> "m_šlienka")
    function createGaps(word) {
      gapPositions = [];
      let allowedPreceding = (currentLetterGroup === 'all')
        ? "bmprsvzlcf"
        : currentLetterGroup.toLowerCase();

      for (let i = 0; i < word.length; i++) {
        if (i > 0 && allowedPreceding.includes(word[i - 1].toLowerCase()) && "iyíý".includes(word[i])) {
          // If 'i' or 'í' is immediately followed by a, e, u -> it is part of a diphthong (ia, ie, iu), do NOT gap it
          let nextChar = (i + 1 < word.length) ? word[i + 1].toLowerCase() : '';
          if (nextChar && "aeuáéú".includes(nextChar)) {
            continue;
          }
          gapPositions.push(i);
        }
      }

      // Fallback: any i/y if no preceding match found (excluding diphthongs)
      if (gapPositions.length === 0) {
        for (let i = 0; i < word.length; i++) {
          if ("iyíý".includes(word[i])) {
            let nextChar = (i + 1 < word.length) ? word[i + 1].toLowerCase() : '';
            if (nextChar && "aeuáéú".includes(nextChar)) {
              continue;
            }
            gapPositions.push(i);
            break;
          }
        }
      }

      gapIndex = 0;
      let chars = word.split("");
      gapPositions.forEach(pos => {
        chars[pos] = "_";
      });
      return chars.join("");
    }

    // SHOW NEXT ADAPTIVE WORD
    function showWord() {
      if (isPaused || words.length === 0) return;

      let mode = document.getElementById("practiceModeSelect")?.value || "normal";
      let wrongKeys = Object.keys(wrongMap).filter(w => words.includes(w));
      let helpKeys = Object.keys(helpMap).filter(w => words.includes(w));
      let needPracticeKeys = Array.from(new Set([...wrongKeys, ...helpKeys]));

      let practicedWords = words.filter(w => stats[w] && stats[w].attempts > 0);
      let meanSpeed = 0;
      if (practicedWords.length > 0) {
        let sum = practicedWords.reduce((acc, w) => acc + stats[w].totalTime / stats[w].attempts, 0);
        meanSpeed = sum / practicedWords.length;
      }
      let slowThreshold = SLOW_SPEED_MULTIPLIER * meanSpeed;

      let slowN = parseInt(document.getElementById("slowCountInput")?.value || "5", 10) || 5;
      let slowWords = practicedWords
        .filter(w => !needPracticeKeys.includes(w) && (stats[w].totalTime / stats[w].attempts) > slowThreshold)
        .sort((a, b) => (stats[b].totalTime / stats[b].attempts) - (stats[a].totalTime / stats[a].attempts))
        .slice(0, slowN);

      let pool;
      if (mode === "wrong") {
        pool = needPracticeKeys.length > 0 ? needPracticeKeys : words;
      } else if (mode === "slow") {
        pool = slowWords.length > 0 ? slowWords : (needPracticeKeys.length > 0 ? needPracticeKeys : words);
        slowModeForced = slowWords.length > 0;
      } else {
        // Normal adaptive cycle
        let zeroCells = words.filter(w =>
          (matrixCount[w] || 0) === 0 &&
          !needPracticeKeys.includes(w) &&
          !slowWords.includes(w)
        );

        slowModeCounter++;
        let isInjectionTurn = (slowModeCounter % SLOW_FEATURED_EVERY === 0);

        if (isInjectionTurn && (needPracticeKeys.length > 0 || slowWords.length > 0)) {
          pool = needPracticeKeys.length > 0 ? needPracticeKeys : slowWords;
        } else if (needPracticeKeys.length > 0 && zeroCells.length === 0) {
          pool = needPracticeKeys;
        } else if (zeroCells.length > 0) {
          pool = zeroCells;
        } else {
          let minCount = Math.min(...words.map(w => matrixCount[w] || 0));
          pool = words.filter(w =>
            (matrixCount[w] || 0) === minCount &&
            !needPracticeKeys.includes(w)
          );
          if (pool.length === 0) pool = words;
        }
      }

      let available = pool.filter(w => w !== lastWord && !recentWords.slice(-3).includes(w));
      if (available.length === 0) available = pool.filter(w => w !== lastWord);
      if (available.length === 0) available = pool;

      currentWord = available[Math.floor(Math.random() * available.length)];
      lastWord = currentWord;

      recentWords.push(currentWord);
      if (recentWords.length > 15) recentWords.shift();

      let wordDiv = document.getElementById("word");
      wordDiv.classList.remove("correctWord");
      wordDiv.textContent = createGaps(currentWord);

      if (document.getElementById("autoAudioCheckbox")?.checked) {
        speakWord();
      }

      startTime = performance.now();
      totalPausedTime = 0;
      mistakesThisWord = 0;

      // Lock buttons until mouse passes center circle
      buttonsEnabled = false;
      const circle = document.getElementById('centerCircle');
      circle.classList.remove('unlocked');
      circle.style.pointerEvents = 'auto';
      document.querySelectorAll('button.choice').forEach(b => b.classList.add('locked'));

      if (circle.matches(':hover')) {
        unlockButtons();
      }

      highlightActiveCell();
      resetInactivityTimer();
    }

    // USER CHOOSES A LETTER (i, y, í, ý)
    function chooseLetter(letter) {
      if (isPaused || !buttonsEnabled) return;
      resetInactivityTimer();

      if (pauseStart !== 0) {
        totalPausedTime += performance.now() - pauseStart;
        pauseStart = 0;
      }

      let correctLetter = currentWord[gapPositions[gapIndex]];

      if (letter === correctLetter) {
        fillLetter(letter);
        gapIndex++;

        if (gapIndex === gapPositions.length) {
          finishWord();
        }
      } else {
        mistakesThisWord++;
        let targetN = parseInt(document.getElementById("successThreshold")?.value || "4", 10);

        if (!stats[currentWord]) {
          stats[currentWord] = { totalTime: 0, attempts: 0, countdown: targetN };
        } else {
          stats[currentWord].countdown = targetN;
        }

        let buttons = document.querySelectorAll('.choice');
        for (let btn of buttons) {
          if (btn.textContent === letter) {
            btn.classList.add('wrong-animation');
            setTimeout(() => btn.classList.remove('wrong-animation'), 400);
            break;
          }
        }

        const feedbackEl = document.getElementById("feedback");
        feedbackEl.textContent = "Skús znova ❌";
        feedbackEl.className = "wrong";

        incorrectCount++;
        logWrongLetter(letter);
        updateStats();
        saveProgress();
      }
    }

    // USER CLICKS '?' (HELP / "NEVIEM" BUTTON)
    function chooseHelp() {
      if (isPaused || !buttonsEnabled) return;
      resetInactivityTimer();

      if (pauseStart !== 0) {
        totalPausedTime += performance.now() - pauseStart;
        pauseStart = 0;
      }

      let correctLetter = currentWord[gapPositions[gapIndex]];
      if (!correctLetter) return;

      // Fill in correct letter on screen
      fillLetter(correctLetter);

      let targetN = parseInt(document.getElementById("successThreshold")?.value || "4", 10);
      if (!stats[currentWord]) {
        stats[currentWord] = { totalTime: 0, attempts: 0, countdown: targetN };
      }
      stats[currentWord].countdown = targetN;

      // Register in helpMap (NOT wrongMap)
      helpMap[currentWord] = true;
      helpCount++;

      const feedbackEl = document.getElementById("feedback");
      feedbackEl.innerHTML = `Nevadí 😊 Správne je <b>${correctLetter}</b>`;
      feedbackEl.className = "help";

      // Lock buttons while showing help hint
      buttonsEnabled = false;
      document.querySelectorAll('button.choice').forEach(b => b.classList.add('locked'));

      updateStats();
      saveProgress();

      setTimeout(() => {
        gapIndex++;
        if (gapIndex >= gapPositions.length) {
          let wordDiv = document.getElementById("word");
          if (wordDiv) {
            wordDiv.textContent = currentWord;
            wordDiv.classList.add("correctWord");
          }
          setTimeout(() => {
            showWord();
          }, 800);
        } else {
          buttonsEnabled = false;
          const circle = document.getElementById('centerCircle');
          if (circle) {
            circle.classList.remove('unlocked');
            circle.style.pointerEvents = 'auto';
            if (circle.matches(':hover')) {
              unlockButtons();
            }
          }
        }
      }, 1000);
    }

    function logWrongLetter(letter) {
      let pos = gapPositions[gapIndex];
      if (!wrongMap[currentWord]) {
        wrongMap[currentWord] = {};
      }
      if (!wrongMap[currentWord][pos]) {
        wrongMap[currentWord][pos] = [];
      }
      wrongMap[currentWord][pos].push(letter);
    }

    function fillLetter(letter) {
      let wordDiv = document.getElementById("word");
      let chars = wordDiv.textContent.split("");
      chars[gapPositions[gapIndex]] = letter;
      wordDiv.textContent = chars.join("");
    }

    // WORD COMPLETED SUCCESSFULLY
    function finishWord() {
      let endTime = performance.now();
      let time = (endTime - startTime - totalPausedTime) / 1000;
      let perLetter = time / (gapPositions.length || 1);

      // Filter extreme outliers (> 15s)
      if (perLetter > 15) {
        perLetter = 15;
        time = 15 * (gapPositions.length || 1);
      }

      recentTimes.push(perLetter);
      if (recentTimes.length > 50) recentTimes.shift();

      speedSamples.push(perLetter);

      let targetN = parseInt(document.getElementById("successThreshold")?.value || "4", 10);

      if (!stats[currentWord]) {
        stats[currentWord] = { totalTime: 0, attempts: 0, countdown: targetN };
      }

      if (slowModeForced) {
        stats[currentWord].totalTime = 0;
        stats[currentWord].attempts = 0;
        slowModeForced = false;
      }

      stats[currentWord].attempts += 1;
      stats[currentWord].totalTime += time;

      let wasInWrongMap = wrongMap[currentWord] !== undefined;
      let wasInHelpMap = !wasInWrongMap && helpMap[currentWord] !== undefined;
      let graduated = false;

      if (!wasInWrongMap && !wasInHelpMap) {
        correctCount++;
      }

      if (mistakesThisWord === 0 && wasInWrongMap) {
        if (stats[currentWord].countdown === undefined) stats[currentWord].countdown = targetN;
        stats[currentWord].countdown -= 1;

        if (stats[currentWord].countdown <= 0) {
          let mistakesForgiven = 0;
          for (let pos in wrongMap[currentWord]) {
            mistakesForgiven += wrongMap[currentWord][pos].length;
          }
          incorrectCount = Math.max(0, incorrectCount - mistakesForgiven);
          delete wrongMap[currentWord];
          delete wrongCount[currentWord];
          delete helpMap[currentWord];
          matrixCountIncrement(currentWord);
          graduated = true;
        } else {
          wrongCount[currentWord] = (wrongCount[currentWord] || 0) + 1;
        }
      } else if (mistakesThisWord === 0 && wasInHelpMap) {
        if (stats[currentWord].countdown === undefined) stats[currentWord].countdown = targetN;
        stats[currentWord].countdown -= 1;

        if (stats[currentWord].countdown <= 0) {
          delete helpMap[currentWord];
          matrixCountIncrement(currentWord);
          graduated = true;
        }
      } else if (wasInWrongMap) {
        wrongCount[currentWord] = (wrongCount[currentWord] || 0) + 1;
      } else if (wasInHelpMap) {
        // Kept in helpMap for practice
      } else {
        matrixCountIncrement(currentWord);
      }

      const feedbackEl = document.getElementById("feedback");
      if (graduated) {
        feedbackEl.textContent = `Výborne! Slovo "${currentWord}" úspešne zvládnuté! 🎓`;
      } else {
        feedbackEl.textContent = "Správne! 🎉";
      }
      feedbackEl.className = "correct";

      updateStats();
      saveProgress();
      saveDailyHistory();

      let wordDiv = document.getElementById("word");
      wordDiv.textContent = currentWord;
      wordDiv.classList.add("correctWord");

      setTimeout(showWord, 800);
    }

    // SPEECH SYNTHESIS
    function speakWord() {
      if (!currentWord) return;
      let utterance = new SpeechSynthesisUtterance(currentWord);
      utterance.lang = "sk-SK";
      speechSynthesis.cancel();
      speechSynthesis.speak(utterance);
    }

    // STATS UPDATE & VISUALIZATIONS
    function updateStats() {
      let total = correctCount + incorrectCount;
      let accuracy = total > 0 ? (correctCount / total * 100).toFixed(1) : 0;

      let statsTxt = "Správne: " + correctCount +
        " | Nesprávne: " + incorrectCount;
      if (helpCount > 0) {
        statsTxt += " | Pomoc (?): " + helpCount;
      }
      statsTxt += " | Presnosť: " + accuracy + "%";

      document.getElementById("stats").textContent = statsTxt;

      displayWrongWords();
      displayHelpWords();
      displaySlowWords();
      drawChart();
      renderMatrix();
    }

    // DISPLAY WRONG WORDS (Compact Badges)
    function displayWrongWords() {
      let wrongKeys = Object.keys(wrongMap).filter(w => words.includes(w));
      let html = "<b>❌ Chybné slová:</b><br>";

      if (wrongKeys.length === 0) {

      } else {

          let countTxt = count ? ` (${count}x)` : '';

        });
        html += tags.join(" ");
      }

      document.getElementById("wrongWords").innerHTML = html;
    }

    // DISPLAY HELP WORDS (Compact Blue Badges)
    function displayHelpWords() {
      let el = document.getElementById("helpWords");
      if (!el) return;
      let helpKeys = Object.keys(helpMap).filter(w => words.includes(w));
      let html = "<b>❓ Slová s pomocou (?):</b><br>";

      if (helpKeys.length === 0) {
        html += "<span style='color:var(--text-muted); font-size:0.76rem;'>Žiadne slová s pomocou.</span>";
      } else {
        let tags = helpKeys.map(w => {
          let count = stats[w]?.countdown;
          let countTxt = count ? ` (${count}x)` : '';
          return `<span class="tag-help">${w}${countTxt}</span>`;
        });
        html += tags.join(" ");
      }

      el.innerHTML = html;

    // DISPLAY SLOW WORDS (Compact Badges)
    function displaySlowWords() {
      let practiced = words.filter(w => stats[w] && stats[w].attempts > 0);
      practiced.sort((a, b) => {
        let avgA = stats[a].totalTime / stats[a].attempts;
        let avgB = stats[b].totalTime / stats[b].attempts;
        return avgB - avgA;
      });

      let nTarget = parseInt(document.getElementById("slowCountInput")?.value || "5", 10) || 5;
      let slowList = practiced.slice(0, nTarget);

      let html = "<b>🐢 Najpomalšie slová:</b><br>";
      if (slowList.length === 0) {
        html += "<span style='color:var(--text-muted); font-size:0.76rem;'>Zatiaľ žiadne záznamy.</span>";
      } else {
        let tags = slowList.map(w => {
          let avg = (stats[w].totalTime / stats[w].attempts).toFixed(1);
          return `<span class="tag-slow">${w} (${avg}s)</span>`;
        });
        html += tags.join(" ");
      }

      document.getElementById("slowWords").innerHTML = html;
    }

    // OPTIMAL GRID CALCULATOR FOR MATRIX
    function calculateOptimalGrid(N) {
      let bestC = N;
      let bestR = 1;
      let minUnused = N;
      let bestRatioDiff = Infinity;
      const targetRatio = 1.15;

      for (let r = 1; r <= N; r++) {
        let c = Math.ceil(N / r);
        let unused = (c * r) - N;
        let ratio = c / r;

        if (ratio < 0.6 || ratio > 2.0) continue;

        if (unused < minUnused) {
          minUnused = unused;
          bestC = c;
          bestR = r;
          bestRatioDiff = Math.abs(ratio - targetRatio);
        } else if (unused === minUnused) {
          let ratioDiff = Math.abs(ratio - targetRatio);
          if (ratioDiff < bestRatioDiff) {
            bestC = c;
            bestR = r;
            bestRatioDiff = ratioDiff;
          }
        }
      }

      if (bestC * bestR < N) {
        bestC = Math.ceil(Math.sqrt(N));
        bestR = Math.ceil(N / bestC);
      }

      return { cols: bestC, rows: bestR };
    }

    // HIGHLIGHT CURRENT ACTIVE WORD IN MATRIX
    function highlightActiveCell() {
      document.querySelectorAll(".matrix-cell").forEach(c => c.classList.remove("active-target"));
      if (!currentWord) return;
      let target = document.querySelector(`.matrix-cell[data-word="${currentWord}"]`);
      if (target) target.classList.add("active-target");
    }

    // RENDER WORD MATRIX
    function renderMatrix() {
      const container = document.getElementById("wordMatrix");
      if (!container) return;

      container.innerHTML = "";

      let N = words.length;
      if (N === 0) {
        container.innerHTML = "<div style='color:var(--text-muted); font-size:0.8rem; padding:10px;'>Žiadne slová vo vybranej kategórii.</div>";
        return;
      }

      let grid = calculateOptimalGrid(N);

      container.style.display = "grid";
      container.style.gridTemplateColumns = `repeat(${grid.cols}, 1fr)`;
      container.style.gap = "2px";

      const TEAL_STEPS = [
        "hsl(174,70%,82%)",
        "hsl(174,70%,72%)",
        "hsl(174,70%,62%)",
        "hsl(174,70%,52%)",
        "hsl(174,70%,42%)",
        "hsl(174,70%,32%)"
      ];
      const RED_STEPS = [
        "hsl(0,70%,82%)",
        "hsl(0,70%,72%)",
        "hsl(0,70%,62%)",
        "hsl(0,70%,52%)",
        "hsl(0,70%,42%)",
        "hsl(0,70%,32%)"
      ];
      const BLUE_STEPS = [
        "hsl(215,80%,82%)",
        "hsl(215,80%,72%)",
        "hsl(215,80%,62%)",
        "hsl(215,80%,52%)",
        "hsl(215,80%,42%)",
        "hsl(215,80%,32%)"
      ];

      // Slow words set
      let practiced = words.filter(w => stats[w] && stats[w].attempts > 0);
      practiced.sort((a, b) => {
        let avgA = stats[a].totalTime / stats[a].attempts;
        let avgB = stats[b].totalTime / stats[b].attempts;
        return avgB - avgA;
      });
      let slowN = parseInt(document.getElementById("slowCountInput")?.value || "5", 10) || 5;
      let slowSet = new Set(practiced.slice(0, slowN).map(w => w));

      words.forEach(w => {
        let mc = matrixCount[w] || 0;
        let rawAtt = stats[w]?.attempts || 0;
        let avgTime = rawAtt > 0 ? (stats[w].totalTime / rawAtt).toFixed(1) : "-";
        let isWrong = wrongMap[w] !== undefined;
        let isHelp = !isWrong && helpMap[w] !== undefined;
        let isSlow = slowSet.has(w);
        let remainingWrong = isWrong ? (stats[w]?.countdown ?? 0) : 0;
        let remainingHelp = isHelp ? (stats[w]?.countdown ?? 0) : 0;

        let cell = document.createElement("div");
        cell.className = "matrix-cell";
        cell.dataset.word = w;

        // Tooltip
        if (isWrong) {
          cell.title = `Slovo: ${w}\n❌ Nesprávne [zostáva: ${remainingWrong}x]\nCelkom: ${rawAtt}x | ${avgTime}s`;
          let stepIndex = Math.min(5, remainingWrong - 1);
          cell.style.backgroundColor = RED_STEPS[Math.max(0, stepIndex)];
        } else if (isHelp) {
          cell.title = `Slovo: ${w}\n❓ Pomoc [zostáva: ${remainingHelp}x]\nCelkom: ${rawAtt}x | ${avgTime}s`;
          let stepIndex = Math.min(5, remainingHelp - 1);
          cell.style.backgroundColor = BLUE_STEPS[Math.max(0, stepIndex)];
        } else if (mc === 0) {
          cell.title = `Slovo: ${w}\nNeprecvičené\nCelkom: ${rawAtt}x | ${avgTime}s`;
          cell.style.backgroundColor = "var(--border-strong)";
        } else {
          cell.title = `Slovo: ${w}\nCyklus: ${mc}x | Celkom: ${rawAtt}x | ${avgTime}s`;
          if (isSlow) cell.title += `\n🐢 Najpomalšie (${avgTime}s)`;
          let stepIndex = Math.min(5, mc - 1);
          cell.style.backgroundColor = TEAL_STEPS[stepIndex];
        }

        if (isSlow && !isWrong && !isHelp && mc > 0) {
          cell.classList.add("is-slow");
        }

        // Hover text in fixed bottom pane
        cell.addEventListener("mouseenter", () => {
          if (isWrong) {
            document.getElementById("hovered-word-info").innerHTML =
              `Slovo: <b>${w}</b> <span style='color:var(--danger);'>[❌ ${remainingWrong}x zostáva]</span> &mdash; celkom: ${rawAtt}x, ${avgTime}s`;
          } else if (isHelp) {
            document.getElementById("hovered-word-info").innerHTML =
              `Slovo: <b>${w}</b> <span style='color:#2563eb;'>[❓ ${remainingHelp}x na precvičenie]</span> &mdash; celkom: ${rawAtt}x, ${avgTime}s`;
          } else if (mc === 0) {
            document.getElementById("hovered-word-info").innerHTML =
              `Slovo: <b>${w}</b> &mdash; Neprecvičené (${rawAtt}x, ${avgTime}s)`;
          } else if (isSlow) {
            document.getElementById("hovered-word-info").innerHTML =
              `Slovo: <b>${w}</b> <span style='color:#f59e0b;'>[🐢 ${avgTime}s]</span> &mdash; cyklus: ${mc}x`;
          } else {
            document.getElementById("hovered-word-info").innerHTML =
              `Slovo: <b>${w}</b> &mdash; cyklus: ${mc}x | celkom: ${rawAtt}x, ${avgTime}s`;
          }
        });

        cell.addEventListener("mouseleave", () => {
          document.getElementById("hovered-word-info").innerHTML = "Prejdi myšou po tabuľke...";
        });

        // Click to practice this word directly
        cell.addEventListener("click", () => {
          if (!isPaused) {
            currentWord = w;
            lastWord = currentWord;
            let wordDiv = document.getElementById("word");
            wordDiv.classList.remove("correctWord");
            wordDiv.textContent = createGaps(currentWord);

            if (document.getElementById("autoAudioCheckbox")?.checked) {
              speakWord();
            }

            startTime = performance.now();
            totalPausedTime = 0;
            mistakesThisWord = 0;

            buttonsEnabled = false;
            const circle = document.getElementById('centerCircle');
            circle.classList.remove('unlocked');
            circle.style.pointerEvents = 'auto';
            document.querySelectorAll('button.choice').forEach(b => b.classList.add('locked'));
            if (circle.matches(':hover')) {
              unlockButtons();
            }
            highlightActiveCell();
            resetInactivityTimer();
          }
        });

        container.appendChild(cell);
      });

      // Transparent placeholder cells for grid alignment
      let totalCells = grid.cols * grid.rows;
      for (let i = N; i < totalCells; i++) {
        let placeholder = document.createElement("div");
        placeholder.className = "matrix-cell";
        placeholder.style.backgroundColor = "transparent";
        placeholder.style.border = "none";
        placeholder.style.pointerEvents = "none";
        container.appendChild(placeholder);
      }

      highlightActiveCell();
    }

    // THEME-AWARE SPEED CHART CANVAS
    function drawChart() {
      const canvas = document.getElementById("speedChart");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      const w = canvas.width;
      const h = canvas.height;

      ctx.clearRect(0, 0, w, h);

      const isDark = document.documentElement.getAttribute("data-theme") === "dark" ||
        (!document.documentElement.getAttribute("data-theme") && window.matchMedia("(prefers-color-scheme: dark)").matches);

      const colorGrid = isDark ? "rgba(255, 255, 255, 0.08)" : "#e2e8f0";
      const colorText = isDark ? "#94a3b8" : "#64748b";
      const colorLine = isDark ? "#38bdf8" : "#2563eb";
      const colorPoint = isDark ? "#60a5fa" : "#1d4ed8";

      if (recentTimes.length < 2) {
        ctx.font = "11px system-ui, sans-serif";
        ctx.fillStyle = colorText;
        ctx.textAlign = "center";
        ctx.fillText("Precvič aspoň 2 slová pre graf!", w / 2, h / 2);
        return;
      }

      let maxTime = Math.max(...recentTimes);
      maxTime = Math.max(maxTime, 3);

      let padL = 34;
      let padR = 10;
      let padT = 10;
      let padB = 18;

      let graphW = w - padL - padR;
      let graphH = h - padT - padB;
      let xStep = graphW / (recentTimes.length - 1);

      // Grid lines & labels
      ctx.strokeStyle = colorGrid;
      ctx.fillStyle = colorText;
      ctx.font = "9px system-ui, sans-serif";
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";

      ctx.beginPath();
      for (let i = 0; i <= 2; i++) {
        let y = padT + graphH - (i / 2) * graphH;
        ctx.moveTo(padL, y);
        ctx.lineTo(w - padR, y);
        let val = (i / 2) * maxTime;
        ctx.fillText(val.toFixed(1) + "s", padL - 4, y);
      }
      ctx.stroke();

      // Line trace
      ctx.strokeStyle = colorLine;
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i < recentTimes.length; i++) {
        let val = recentTimes[i];
        let x = padL + i * xStep;
        let y = padT + graphH - ((val / maxTime) * graphH);

        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();

      // Points
      ctx.fillStyle = colorPoint;
      for (let i = 0; i < recentTimes.length; i++) {
        let val = recentTimes[i];
        let x = padL + i * xStep;
        let y = padT + graphH - ((val / maxTime) * graphH);

        ctx.beginPath();
        ctx.arc(x, y, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // INITIALIZATION ON LOAD
    window.onload = () => {
      loadProgress();
      updateStats();
      displayDailyHistory();
      showWord();
    };
  </script>
